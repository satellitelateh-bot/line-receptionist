services:
  receptionist:
    build: .
    container_name: receptionist
    restart: unless-stopped
    env_file: .env
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    networks: [web, internal]

  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks: [internal]

volumes:
  ollama_data:

networks:
  web:
    external: true
  internal:
