<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumi Hair Studio · AI Receptionist Demo</title>
<style>
:root{--bg:#f3f1ee;--card:#fff;--ink:#222;--muted:#777;--green:#06c755;--line:#e4dfda}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--ink);height:100dvh;display:flex;flex-direction:column}
header{padding:14px 16px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:17px}
header p{margin:2px 0 0;font-size:12px;color:var(--muted)}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:80%;padding:9px 13px;border-radius:16px;white-space:pre-wrap;line-height:1.45;font-size:15px}
.me{align-self:flex-end;background:var(--green);color:#fff;border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.hints{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 8px}
.hints button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:6px 10px;font-size:13px;cursor:pointer}
form{display:flex;gap:8px;padding:10px 16px 16px;background:var(--card);border-top:1px solid var(--line)}
input{flex:1;min-width:0;padding:11px 14px;border:1px solid var(--line);border-radius:20px;font-size:15px}
form button{background:var(--green);color:#fff;border:0;border-radius:20px;padding:0 18px;font-size:15px;cursor:pointer}
form button:disabled{opacity:.5}
</style>
</head>
<body>
<header>
  <h1>Lumi Hair Studio</h1>
  <p>AI receptionist demo · fictional shop · ร้านสมมติสำหรับทดลอง</p>
</header>
<div id="log"></div>
<div class="hints">
  <button type="button">ตัดผมผู้หญิงเท่าไหร่คะ</button>
  <button type="button">พรุ่งนี้ว่างกี่โมงบ้าง</button>
  <button type="button">Are you open on Wednesday?</button>
</div>
<form id="form">
  <input id="text" placeholder="พิมพ์ข้อความ / Type a message" autocomplete="off" maxlength="500">
  <button id="send">ส่ง</button>
</form>
<script>
let sid = null;
try { sid = localStorage.getItem("sid"); } catch (e) {}
if (!sid) { sid = crypto.randomUUID(); try { localStorage.setItem("sid", sid); } catch (e) {} }

const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("text");
const button = document.getElementById("send");

function add(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

async function send(text) {
  add(text, "me");
  button.disabled = true;
  const waiting = add("…", "bot");
  try {
    const res = await fetch("chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sid, message: text }),
    });
    const data = await res.json();
    waiting.textContent = res.ok ? data.reply : (data.detail || "Error");
  } catch (e) {
    waiting.textContent = "ขออภัยค่ะ เชื่อมต่อไม่ได้ ลองใหม่อีกครั้งนะคะ";
  }
  log.scrollTop = log.scrollHeight;
  button.disabled = false;
  input.focus();
}

add("สวัสดีค่ะ Lumi Hair Studio ยินดีให้บริการค่ะ 😊 ถามราคา เวลาเปิด หรือจองคิวได้เลยนะคะ", "bot");
form.onsubmit = (e) => { e.preventDefault(); const v = input.value.trim(); if (v) { input.value = ""; send(v); } };
document.querySelectorAll(".hints button").forEach((b) => (b.onclick = () => send(b.textContent)));
</script>
</body>
</html>
